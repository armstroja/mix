<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIXER AIR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:rgba(255,255,255,.8);--faint:rgba(255,255,255,.55);--line:rgba(255,255,255,.5);
  --seg-off:rgba(255,255,255,.14);--seg-on:rgba(255,255,255,.62);
  --dot-on:rgba(255,255,255,.22);
  --shadow:0 0 8px rgba(0,0,0,.35);
}
/* object-fit:cover = scale (keeping aspect ratio) until the video fills the
   whole viewport, then crop whatever overflows. Never distorts. */
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-1;background:#000;pointer-events:none;}
html,body{height:100%;}
body{
  background:#000;color:var(--ink);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{display:flex;flex-direction:column;align-items:center;gap:30px;padding:24px;transition:opacity .2s;}
body.drag #app{opacity:.55;}
#cols{display:flex;gap:16px;align-items:flex-end;}
.strip{display:flex;flex-direction:column-reverse;align-items:center;gap:5px;width:52px;}
.strip.empty .seg{opacity:.35;}
.strip.muted .seg{opacity:.25;}
.seg{
  width:52px;height:15px;border:none;border-radius:6px;cursor:pointer;
  background:var(--seg-off);
  transition:background .06s,transform .1s,opacity .2s;
}
.seg.on{background:var(--seg-on);}
.seg:active{transform:scale(.9);}
.name{
  margin-top:6px;background:none;border:none;cursor:pointer;font:inherit;
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-shadow:var(--shadow);
}
.strip.empty .name{color:var(--faint);}
.fn{
  width:100%;height:10px;font-size:7px;letter-spacing:.06em;text-align:center;
  color:var(--faint);text-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-transform:uppercase;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 14px),transparent);
          mask-image:linear-gradient(to right,#000 calc(100% - 14px),transparent);
}
#dot{
  width:56px;height:56px;border-radius:50%;cursor:pointer;
  background:transparent;border:1px solid var(--line);box-shadow:var(--shadow);transition:background .2s;
}
#dot.playing{background:var(--dot-on);}
#transport{display:flex;align-items:center;gap:12px;width:min(340px,80vw);}
#bar{flex:1;position:relative;height:23px;cursor:pointer;touch-action:none;}
#bar::before{content:'';position:absolute;left:0;right:0;top:11px;height:1px;background:var(--line);}
#fill{
  position:absolute;left:0;right:0;top:11px;height:1px;background:rgba(255,255,255,.9);
  transform-origin:left;transform:scaleX(0);will-change:transform;
  transition:transform .25s linear;
}
#fill.jump{transition:none;}
#time{text-shadow:var(--shadow);font-size:9px;letter-spacing:.08em;color:var(--faint);min-width:64px;text-align:right;font-variant-numeric:tabular-nums;}
#hint{text-shadow:var(--shadow);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);height:10px;}
#bgwrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
#bgbtn,.pbtn,#bgpanel a{
  background:none;border:none;font-family:inherit;cursor:pointer;text-decoration:none;
  font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);text-shadow:var(--shadow);
}
#bgbtn:hover,.pbtn:hover,#bgpanel a:hover{color:var(--ink);}
#bgpanel{display:flex;flex-direction:column;align-items:center;gap:8px;}
#bgpanel[hidden]{display:none;}
#bgpanel input{
  width:min(240px,70vw);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:6px;
  padding:7px 10px;font-family:inherit;font-size:11px;color:var(--ink);text-align:center;outline:none;
  -webkit-user-select:text;user-select:text;
}
#bgpanel input::placeholder{color:var(--faint);}
#bgpanel input:focus{border-color:var(--ink);}
@media (pointer:coarse){#bgpanel input{font-size:16px;}} /* stops iOS zooming on focus */
.prow{display:flex;gap:18px;align-items:center;}
#bgstat{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-shadow:var(--shadow);min-height:10px;}
#credit{
  position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));text-align:center;
  font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);text-shadow:var(--shadow);pointer-events:none;
}
#credit[hidden]{display:none;}
#credit a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);pointer-events:auto;}
#credit a:hover{color:var(--ink);}
button:focus-visible,#dot:focus-visible{outline:1px solid var(--seg-on);outline-offset:3px;}
@media (prefers-reduced-motion:reduce){#fill{transition:none;}}
</style>
</head>
<body>

<!-- background.mp4 sits in the same folder as this file. preload=none keeps it off
     the wire until the user actually starts playback. -->
<video id="bg" muted loop playsinline preload="none" disablepictureinpicture disableremoteplayback></video>

<div id="app">
  <div id="cols"></div>
  <button id="dot" type="button" aria-label="Play / pause"></button>
  <div id="transport">
    <div id="bar"><div id="fill"></div></div>
    <div id="time">–:–– / –:––</div>
  </div>
  <div id="hint">drop stems anywhere</div>
  <div id="bgwrap">
    <button id="bgbtn" type="button">background</button>
    <div id="bgpanel" hidden>
      <input id="pxkey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="pexels api key">
      <input id="pxq" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="search: abstract, rain, neon…">
      <div class="prow">
        <button id="pxgo" class="pbtn" type="button">go</button>
        <button id="pxreset" class="pbtn" type="button">reset</button>
        <a href="https://www.pexels.com/api/" target="_blank" rel="noopener">get a key</a>
      </div>
      <div id="bgstat"></div>
    </div>
  </div>
</div>
<div id="credit" hidden>video by <a id="creditName" href="#" target="_blank" rel="noopener"></a> on <a id="creditPx" href="#" target="_blank" rel="noopener">pexels</a></div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.aif,.aiff,.flac,.ogg" multiple hidden>

<script>
const STEMS=['vocals','drums','bass','other'];
const STEPS=7;
const KEYWORDS={
  vocals:['vocal','vox','voice','sing','lead','melody','choir','lyric','harmony'],
  drums: ['drum','beat','kick','snare','hat','perc','rhythm','cymbal','clap'],
  bass:  ['bass','sub','808','groove'],
  other: ['other','inst','guitar','piano','keys','synth','pad','string','horn','brass','fx','misc'],
};

// ── Power settings ────────────────────────────────────────────────
const BG_SD         = 'background.mp4';      // phones / tablets / data-saver
const BG_HQ         = 'background-hq.mp4';   // laptops and desktops (falls back to SD if missing)
const BG_WHILE_IDLE = true;   // false: video only rolls while audio is playing
const TICK_MS       = 250;    // progress updates per second = 1000/TICK_MS
const IDLE_SUSPEND  = 20000;  // ms of pause before the audio hardware is released

let ctx=null;
const st={};
STEMS.forEach(id=>{st[id]={buf:null,gain:null,src:null,vol:STEPS,prev:STEPS,muted:false};});
let playing=false,startT=0,offset=0,dur=0,timer=0,idleT=0;

const $=id=>document.getElementById(id);
const dot=$('dot'),fillEl=$('fill'),timeEl=$('time'),barEl=$('bar'),hintEl=$('hint'),fileEl=$('file');
const strips={},segs={},fnEls={};
const bgVid=$('bg');

// ── Background video ──────────────────────────────────────────────
// Decoding video is the single biggest battery cost here, so it only runs
// when it can actually be seen and (optionally) only while audio plays.
let bgLoaded=false;
function bgPlay(){
  if(document.hidden)return;
  if(!bgLoaded){applyBg();return;}   // first call: pick + load a source
  if(!bgVid.getAttribute('src'))return; // still resolving
  bgVid.play().catch(()=>{
    // autoplay blocked (iOS Low Power Mode does this): retry on first touch
    const kick=()=>{bgSync();};
    window.addEventListener('pointerdown',kick,{once:true});
    window.addEventListener('keydown',kick,{once:true});
  });
}
function bgPause(){if(bgLoaded)bgVid.pause();}
function bgSync(){ (playing||BG_WHILE_IDLE) ? bgPlay() : bgPause(); }
// ── Source selection ──────────────────────────────────────────────
// Capability check rather than user-agent sniffing: a mouse-and-hover device with a
// wide window is a laptop/desktop; the network hints respect data-saver settings.
function wantHQ(){
  const c=navigator.connection;
  if(c&&(c.saveData||c.effectiveType==='2g'||c.effectiveType==='slow-2g'||c.effectiveType==='3g'))return false;
  if(matchMedia('(prefers-reduced-data: reduce)').matches)return false;
  return matchMedia('(hover:hover) and (pointer:fine)').matches && innerWidth>=1000;
}

// ── Pexels: bring your own API key ────────────────────────────────
// One search fetches a shuffled playlist of up to 10 clips. The key, search term and
// playlist (with the current position) live in localStorage on this device; the key is
// only ever sent to api.pexels.com. After that first fetch there are no more API calls:
// reloads resume the cached playlist until you hit "go" (new playlist) or "reset".
const LS_KEY='mixerair:pexels';
let px={};
try{px=JSON.parse(localStorage.getItem(LS_KEY)||'null')||{};}catch(e){}
delete px.pick;                     // old single-video cache format
const savePx=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(px));}catch(e){}};
const bgPanel=$('bgpanel'),bgToggle=$('bgbtn'),keyIn=$('pxkey'),qIn=$('pxq'),statEl=$('bgstat'),creditEl=$('credit');
const setStat=t=>{statEl.textContent=t;};
const safeUrl=u=>(typeof u==='string'&&u.startsWith('https://'))?u:'#';
const cur=()=>px.list&&px.list[px.idx||0];
let playlist=false;                 // true while stepping through several Pexels clips

function showCredit(){
  const p=cur();
  if(!p){creditEl.hidden=true;return;}
  const n=$('creditName');
  n.textContent=p.name||'unknown';n.href=safeUrl(p.by);
  $('creditPx').href=safeUrl(p.page);
  creditEl.hidden=false;
}

async function pexelsFetch(){
  const qs=new URLSearchParams({
    query:px.q||'abstract',orientation:'landscape',size:'medium',
    min_duration:'5',max_duration:'30',per_page:'40'
  });
  const r=await fetch('https://api.pexels.com/videos/search?'+qs,{headers:{Authorization:px.key}});
  if(r.status===401||r.status===403){px.key='';px.list=null;savePx();throw new Error('key rejected');}
  if(!r.ok)throw new Error('pexels error '+r.status);
  const vids=((await r.json()).videos||[]).map(v=>({
    id:v.id,page:v.url,name:v.user&&v.user.name,by:v.user&&v.user.url,
    files:(v.video_files||[])
      .filter(f=>f.file_type==='video/mp4'&&f.width)
      .map(f=>({w:f.width,l:f.link}))
      .sort((a,b)=>a.w-b.w)
  })).filter(v=>v.files.length);
  if(!vids.length)throw new Error('no results for \u201c'+(px.q||'abstract')+'\u201d');
  for(let i=vids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vids[i],vids[j]]=[vids[j],vids[i]];}
  px.list=vids.slice(0,10);px.idx=0;
  savePx();
}
// smallest mp4 that's at least the target width, else the biggest available
function chooseFile(files,hq){
  const target=hq?1920:960;
  return (files.find(f=>f.w>=target)||files[files.length-1]).l;
}

async function resolveBg(){
  const hq=wantHQ();
  if(px.key){
    try{
      if(!px.list||!px.list.length){setStat('fetching\u2026');await pexelsFetch();}
      setStat('');showCredit();
      playlist=px.list.length>1;
      return chooseFile(cur().files,hq);
    }catch(e){
      console.warn('Pexels:',e);
      setStat(String(e.message||e));
    }
  }
  playlist=false;creditEl.hidden=true;
  return hq?BG_HQ:BG_SD;
}
async function applyBg(){
  bgLoaded=true;
  const src=await resolveBg();
  bgVid.loop=!playlist;             // single/local video loops; a playlist advances instead
  bgVid.src=src;
  bgSync();
}
// Move to the next clip (wraps around). Only fires while a clip is actually playing,
// so a paused or hidden page never loads more video in the background.
function advance(){
  if(!px.list||!px.list.length)return;
  px.idx=((px.idx||0)+1)%px.list.length;
  savePx();showCredit();
  bgVid.src=chooseFile(cur().files,wantHQ());
  bgSync();
}
bgVid.addEventListener('ended',()=>{if(playlist)advance();});

// If a file fails (missing HQ file, expired Pexels link...): skip that clip, or if the
// whole playlist is dead, drop to the local SD file.
bgVid.addEventListener('error',()=>{
  const src=bgVid.getAttribute('src');
  if(src===BG_SD){console.warn(BG_SD+' not found next to this file');return;}
  const i=px.list?px.list.findIndex(v=>v.files.some(f=>f.l===src)):-1;
  if(i>-1){
    px.list.splice(i,1);
    if(px.list.length){
      px.idx=i%px.list.length;savePx();
      playlist=px.list.length>1;bgVid.loop=!playlist;
      showCredit();
      bgVid.src=chooseFile(cur().files,wantHQ());
      bgSync();return;
    }
    px.list=null;savePx();creditEl.hidden=true;
    setStat('pexels links failed, using local file');
  }
  playlist=false;bgVid.loop=true;
  bgVid.src=BG_SD;bgSync();
});

bgToggle.addEventListener('click',()=>{
  bgPanel.hidden=!bgPanel.hidden;
  if(!bgPanel.hidden){
    keyIn.value='';
    keyIn.placeholder=px.key?'key saved \u2014 paste to replace':'pexels api key';
    qIn.value=px.q||'';
  }
});
$('pxgo').addEventListener('click',async()=>{
  const k=keyIn.value.trim();
  if(k)px.key=k;
  if(!px.key){setStat('paste your pexels api key first');return;}
  px.q=qIn.value.trim()||'abstract';
  px.list=null;px.idx=0;savePx();keyIn.value='';
  await applyBg();
  if(!statEl.textContent)bgPanel.hidden=true;   // stay open only if something went wrong
});
$('pxreset').addEventListener('click',()=>{
  px={};
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  keyIn.value='';qIn.value='';setStat('');creditEl.hidden=true;
  bgPanel.hidden=true;
  applyBg();
});

// ── Keep audio independent of the video ───────────────────────────
// The background is decorative only: force it silent, ask iOS for a media audio
// session, and if a clip starting makes the browser suspend or interrupt the
// AudioContext (Safari does this), resume it straight away.
bgVid.muted=true;bgVid.defaultMuted=true;bgVid.volume=0;
try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
function keepAlive(){
  if(playing&&ctx&&ctx.state!=='running')ctx.resume().catch(()=>{});
}
['play','playing','loadeddata','volumechange'].forEach(ev=>bgVid.addEventListener(ev,()=>{
  if(!bgVid.muted)bgVid.muted=true;
  keepAlive();
}));

// ── UI ────────────────────────────────────────────────────────────
STEMS.forEach(id=>{
  const strip=document.createElement('div');
  strip.className='strip empty';
  const fn=document.createElement('div');fn.className='fn';
  const name=document.createElement('button');
  name.className='name';name.type='button';name.textContent=id;
  name.addEventListener('click',()=>pick(id));
  strip.append(fn,name);
  segs[id]=[];
  for(let i=0;i<STEPS;i++){
    const b=document.createElement('button');
    b.className='seg on';b.type='button';b.setAttribute('aria-label',id+' level '+(i+1));
    b.addEventListener('click',()=>setVol(id,i+1));
    strip.appendChild(b);segs[id].push(b);
  }
  strips[id]=strip;fnEls[id]=fn;
  $('cols').appendChild(strip);
});

function refresh(id){
  const s=st[id];
  segs[id].forEach((b,i)=>b.classList.toggle('on',i<s.vol));
  strips[id].classList.toggle('muted',s.muted);
}

// ── Audio ─────────────────────────────────────────────────────────
function ensureCtx(){
  if(ctx)return;
  ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'playback'});
  ctx.onstatechange=keepAlive;
  STEMS.forEach(id=>{
    const g=ctx.createGain();g.connect(ctx.destination);
    st[id].gain=g;applyGain(id);
  });
}
function applyGain(id){
  const s=st[id];if(!s.gain)return;
  s.gain.gain.setTargetAtTime(s.muted?0:s.vol/STEPS,ctx.currentTime,0.02);
}
function setVol(id,v){
  const s=st[id];
  if(v>1)s.prev=v;
  s.vol=v;s.muted=(v===1);
  refresh(id);applyGain(id);
}
function toggleMute(id){
  const s=st[id];if(!s.buf)return;
  if(!s.muted){if(s.vol>1)s.prev=s.vol;s.muted=true;s.vol=1;}
  else{s.muted=false;s.vol=s.prev||STEPS;}
  refresh(id);applyGain(id);
}
function stopSrc(id){
  const s=st[id];
  try{s.src&&s.src.stop();}catch(e){}
  if(s.src){s.src.onended=null;s.src.disconnect();}
  s.src=null;
}
function spawn(id,off){
  const s=st[id];if(!s.buf)return;
  stopSrc(id);
  const src=ctx.createBufferSource();
  src.buffer=s.buf;src.connect(s.gain);
  src.start(0,Math.max(0,off%s.buf.duration));
  s.src=src;
}
function hasAny(){return STEMS.some(id=>st[id].buf);}
function pos(){return playing?ctx.currentTime-startT:offset;}

function play(){
  if(!hasAny()||playing)return;
  ensureCtx();clearTimeout(idleT);
  const go=()=>{
    STEMS.forEach(id=>spawn(id,offset));
    startT=ctx.currentTime-offset;
    playing=true;dot.classList.add('playing');
    bgSync();startTimer();
  };
  if(ctx.state!=='running')ctx.resume().catch(()=>{}); // don't wait on it: Safari can leave the promise hanging
  go();
}
function pause(){
  if(!playing)return;
  offset=ctx.currentTime-startT;
  STEMS.forEach(stopSrc);
  playing=false;dot.classList.remove('playing');
  stopTimer();render(offset,true);bgSync();
  // nothing is making sound: hand the audio hardware back after a while
  clearTimeout(idleT);
  idleT=setTimeout(()=>{if(!playing&&ctx&&ctx.state==='running')ctx.suspend();},IDLE_SUSPEND);
}
function toggle(){
  if(!hasAny()){pick(null);return;}
  playing?pause():play();
}
function seek(t){
  if(!dur)return;
  t=Math.max(0,Math.min(dur-0.05,t));
  const was=playing;
  if(was)pause();
  offset=t;render(t,true);
  if(was)play();
}

// ── Progress ──────────────────────────────────────────────────────
// A 4 Hz timer plus a CSS transition on the bar, instead of a 60 fps
// requestAnimationFrame loop. Same look, ~15x fewer wakeups, and it keeps
// running when the tab is backgrounded (rAF does not).
function fmt(s){const m=Math.floor(s/60),c=Math.floor(s%60);return m+':'+(c<10?'0':'')+c;}
let lastSec=-1;
function render(p,jump){
  fillEl.classList.toggle('jump',!!jump);
  fillEl.style.transform='scaleX('+(dur?Math.min(1,p/dur):0)+')';
  const sec=Math.floor(p);
  if(sec!==lastSec||!dur){                       // only touch the DOM text once a second
    lastSec=sec;
    timeEl.textContent=dur?fmt(p)+' / '+fmt(dur):'–:–– / –:––';
  }
}
function startTimer(){stopTimer();timer=setInterval(tick,TICK_MS);tick();}
function stopTimer(){clearInterval(timer);timer=0;}
function tick(){
  if(!playing)return;
  const p=pos();
  if(p>=dur){ // reached the end: stop and rewind
    STEMS.forEach(stopSrc);
    playing=false;offset=0;dot.classList.remove('playing');
    stopTimer();render(0,true);bgSync();
    clearTimeout(idleT);
    idleT=setTimeout(()=>{if(!playing&&ctx&&ctx.state==='running')ctx.suspend();},IDLE_SUSPEND);
    return;
  }
  render(p+TICK_MS/1000);   // aim one tick ahead so the CSS transition lands on time
}

// scrub: drag or click the line (mouse, touch and pen)
let scrubbing=false,wasPlaying=false;
const pct=e=>{const r=barEl.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));};
barEl.addEventListener('pointerdown',e=>{
  if(!dur)return;
  barEl.setPointerCapture(e.pointerId);
  scrubbing=true;wasPlaying=playing;
  if(playing)pause();
  render(pct(e)*dur,true);
});
barEl.addEventListener('pointermove',e=>{if(scrubbing)render(pct(e)*dur,true);});
barEl.addEventListener('pointerup',e=>{
  if(!scrubbing)return;
  scrubbing=false;
  offset=pct(e)*dur;render(offset,true);
  if(wasPlaying)play();
});
barEl.addEventListener('pointercancel',()=>{scrubbing=false;if(wasPlaying)play();});

// ── Loading ───────────────────────────────────────────────────────
function detect(name){
  const n=name.toLowerCase();
  for(const id of STEMS)if(KEYWORDS[id].some(k=>n.includes(k)))return id;
  return null;
}
// Match files to stems by name; anything left over fills empty slots.
// A single file picked from a stem's own label goes to that stem.
function assign(files,target){
  if(!files.length)return;
  if(target&&files.length===1){load(target,files[0]);return;}
  const taken=new Set(),rest=[];
  files.forEach(f=>{
    const id=detect(f.name);
    if(id&&!taken.has(id)){taken.add(id);load(id,f);}else rest.push(f);
  });
  const empty=STEMS.filter(id=>!st[id].buf&&!taken.has(id));
  rest.forEach((f,i)=>{if(empty[i])load(empty[i],f);});
}
async function load(id,file){
  ensureCtx();
  try{
    const buf=await ctx.decodeAudioData(await file.arrayBuffer());
    st[id].buf=buf;
    dur=Math.max(dur,buf.duration);
    strips[id].classList.remove('empty');
    fnEls[id].textContent=file.name.replace(/\.[^.]+$/,'');
    hintEl.textContent='';
    if(playing)spawn(id,pos());
    else{lastSec=-1;render(offset,true);}
  }catch(e){
    console.error(e);
    hintEl.textContent='couldn\u2019t decode '+id;
    setTimeout(()=>{hintEl.textContent=hasAny()?'':'drop stems anywhere';},2000);
  }
}
let pickTarget=null;
function pick(id){pickTarget=id;fileEl.click();}
fileEl.addEventListener('change',()=>{
  assign([...fileEl.files],pickTarget);
  fileEl.value='';
});

// drop anywhere on the page
window.addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag');});
window.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag');});
window.addEventListener('drop',e=>{
  e.preventDefault();document.body.classList.remove('drag');
  assign([...e.dataTransfer.files],null);
});

// ── Input ─────────────────────────────────────────────────────────
dot.addEventListener('click',toggle);
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();toggle();return;}
  if(e.key==='ArrowLeft'){e.preventDefault();seek(pos()-5);return;}
  if(e.key==='ArrowRight'){e.preventDefault();seek(pos()+5);return;}
  const i=['1','2','3','4'].indexOf(e.key);
  if(i>-1)toggleMute(STEMS[i]);
});

// Screen off / app backgrounded: stop decoding video and stop the UI timer.
// Audio keeps playing; the clock is rebuilt from ctx.currentTime on return.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){bgPause();stopTimer();}
  else{
    if(playing&&ctx&&ctx.state!=='running')ctx.resume();
    bgSync();
    if(playing)startTimer();
  }
});
bgSync();
</script>
</body>
</html>
