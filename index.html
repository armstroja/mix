<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIXER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0d0d0d;--text-dim:#272727;--text-mid:#272727;--text-faint:#202020;
  --border-dim:#202020;--border-mid:#181818;--seg-off:#181818;--seg-on:#272727;
  --seg-hover:#232323;--bar-bg:#181818;--prog-bg:#1c1c1c;--prog-fill:#313131;
  --dot-bg:#181818;--dot-border:#202020;--dot-playing:#1e1e1e;--dot-border-playing:#2a2a2a;
  --theme-btn-active:#383838;
}
.theme-shale{
  --bg:#191c22;--text-dim:#3a4050;--text-mid:#3a4050;--text-faint:#2c3040;
  --border-dim:#242830;--border-mid:#20242e;--seg-off:#20242e;--seg-on:#303848;
  --seg-hover:#282e3a;--bar-bg:#20242e;--prog-bg:#242830;--prog-fill:#3a4560;
  --dot-bg:#20242e;--dot-border:#242830;--dot-playing:#282e3a;--dot-border-playing:#3a4560;
  --theme-btn-active:#3a4560;
}
.theme-beige{
  --bg:#e8e2d8;--text-dim:#a89888;--text-mid:#908070;--text-faint:#bcb0a4;
  --border-dim:#ccc3b8;--border-mid:#d4ccc2;--seg-off:#d8d0c6;--seg-on:#bcb0a4;
  --seg-hover:#c8c0b6;--bar-bg:#d4ccc2;--prog-bg:#ccc3b8;--prog-fill:#a89888;
  --dot-bg:#d8d0c6;--dot-border:#c8c0b6;--dot-playing:#d0c8be;--dot-border-playing:#a89888;
  --theme-btn-active:#a89888;
}
.theme-sky{
  --bg:#c4d8ea;--text-dim:#6898b4;--text-mid:#5888a8;--text-faint:#88b0cc;
  --border-dim:#98bcd4;--border-mid:#a8cce0;--seg-off:#accce0;--seg-on:#6898b4;
  --seg-hover:#88b4cc;--bar-bg:#a8cce0;--prog-bg:#98bcd4;--prog-fill:#6898b4;
  --dot-bg:#accce0;--dot-border:#98bcd4;--dot-playing:#98c0d8;--dot-border-playing:#6898b4;
  --theme-btn-active:#6898b4;
}
.theme-sea{
  --bg:#c0ddd0;--text-dim:#589878;--text-mid:#4c8868;--text-faint:#7cb498;
  --border-dim:#88bc9c;--border-mid:#98ccb4;--seg-off:#a4ccb8;--seg-on:#589878;
  --seg-hover:#78b094;--bar-bg:#98ccb4;--prog-bg:#88bc9c;--prog-fill:#589878;
  --dot-bg:#a4ccb8;--dot-border:#88bc9c;--dot-playing:#90c0a8;--dot-border-playing:#589878;
  --theme-btn-active:#589878;
}
body{
  background:var(--bg);color:var(--text-mid);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 20px;user-select:none;gap:28px;
  transition:background .5s,color .5s;overflow:hidden;
  position:relative;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
#bg-breath{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,var(--seg-off) 0%,transparent 62%);
  opacity:.08;will-change:transform,opacity;}
h1{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--text-mid);cursor:default;transition:opacity .25s ease;}
h1.fading{opacity:0;}
a{font-size:8px;letter-spacing:.28em;text-transform:lowercase;color:var(--text-dim);}
#theme-row{display:flex;gap:7px;align-items:center;}
.theme-dot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:1px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0;}
.theme-dot:hover{transform:scale(1.25);}
.theme-dot.active{border-color:var(--theme-btn-active);transform:scale(1.25);}
#td-black{background:#181818;}#td-shale{background:#303848;}
#td-beige{background:#ccc3b8;}#td-sky{background:#6898b4;}#td-sea{background:#589878;}
#stems-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:460px;}
.drop-zone{border:1px dashed var(--border-dim);border-radius:8px;padding:14px 6px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative;min-height:72px;}
.drop-zone,.eq-card,.channel-strip,.seg,#center-dot,#export-btn,.theme-dot{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.channel-strip{touch-action:none;}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--seg-hover);background:var(--seg-off);}
.drop-zone input[type=file]{display:none;}
.dz-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-mid);margin-bottom:6px;}
.dz-hint{font-size:9px;color:var(--border-dim);}
.eq-card{border:1px solid var(--border-mid);border-radius:8px;padding:10px 8px 8px;position:relative;min-height:72px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .2s,opacity .3s;}
.eq-card:hover{border-color:var(--seg-hover);}
.eq-card.muted{opacity:.4;}
.eq-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--seg-on);}
.eq-bars{display:flex;align-items:flex-end;gap:2px;height:32px;flex:1;}
.eq-bar{flex:1;border-radius:2px 2px 0 0;background:var(--bar-bg);min-height:2px;}
.eq-filename{font-size:7px;color:var(--text-faint);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#cross-wrap{display:flex;flex-direction:column;align-items:center;gap:26px;transition:transform 1.6s cubic-bezier(.4,0,.2,1);position:relative;}
#mixer-row{display:flex;align-items:flex-end;gap:16px;}
.channel-strip{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:5px;outline:none;border-radius:6px;}
.channel-strip:focus-visible{box-shadow:0 0 0 1px var(--seg-on);}
.channel-strip:focus-visible .arm-label{color:var(--seg-on);}
.arm-label{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-mid);flex-shrink:0;margin-top:6px;}
.arm-label.inactive{color:var(--border-mid);}
.seg{background:var(--seg-off);border:none;cursor:pointer;border-radius:6px;flex-shrink:0;flex-grow:0;transition:background .06s,transform .1s,opacity .2s,box-shadow .3s;position:relative;overflow:hidden;width:52px;height:15px;}
.seg.on{background:var(--seg-on);}
.seg:active{transform:scale(.88);}
.seg.muted{opacity:.12;}
.seg.glowing{box-shadow:0 0 6px 1px rgba(255,255,255,0.05);}
.seg-fill{position:absolute;bottom:0;left:0;width:100%;height:0%;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .15s;}
#dot-wrap{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;}
#cross-fill{position:absolute;top:50%;left:50%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--seg-off) 0%,transparent 72%);opacity:0.45;pointer-events:none;transition:opacity .6s ease;}
#center-dot{width:56px;height:56px;border-radius:50%;background:var(--dot-bg);border:1px solid var(--dot-border);cursor:pointer;flex-shrink:0;transition:background .2s,border-color .2s;position:relative;z-index:1;outline:none;}
#center-dot:focus-visible{box-shadow:0 0 0 2px var(--seg-on);}
#center-dot.playing{background:var(--dot-playing);border-color:var(--dot-border-playing);}
#transport{display:flex;align-items:center;gap:12px;width:340px;}
#prog-wrap{
  flex:1;height:1px;background:var(--prog-bg);cursor:pointer;position:relative;
  padding:11px 0;margin:-11px 0;background-clip:content-box;
  touch-action:none;
}
#prog-bar{height:1px;background:var(--prog-fill);width:0%;pointer-events:none;position:absolute;top:11px;left:0;transition:height .15s ease,top .15s ease;}
#prog-wrap.scrubbing #prog-bar{height:2px;top:10.5px;}
#prog-thumb{
  position:absolute;top:50%;width:10px;height:10px;border-radius:50%;
  background:var(--prog-fill);transform:translate(-50%,-50%) scale(0);
  pointer-events:none;transition:transform .15s ease;left:0%;
}
#prog-wrap.scrubbing #prog-thumb{transform:translate(-50%,-50%) scale(1);}
#time{font-size:9px;color:var(--text-faint);letter-spacing:.08em;min-width:56px;text-align:right;}
#status{font-size:9px;letter-spacing:.16em;color:var(--text-faint);text-transform:uppercase;height:12px;}
#export-btn{background:none;border:none;font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-dim);cursor:pointer;padding:0;transition:color .2s;font-family:inherit;}
#export-btn:hover{color:var(--text-mid);}
#export-btn:disabled{opacity:.3;cursor:default;}
</style>
</head>
<body>

<div id="bg-breath"></div>

<h1 id="title">Stem Mixer</h1>
<a href="https://bandlab.com/splitter">split your own songs</a>

<div id="theme-row">
  <div class="theme-dot active" id="td-black" title="Black" onclick="setTheme('black','td-black')"></div>
  <div class="theme-dot" id="td-shale" title="Shale" onclick="setTheme('shale','td-shale')"></div>
  <div class="theme-dot" id="td-beige" title="Beige" onclick="setTheme('beige','td-beige')"></div>
  <div class="theme-dot" id="td-sky"   title="Sky"   onclick="setTheme('sky','td-sky')"></div>
  <div class="theme-dot" id="td-sea"   title="Sea"   onclick="setTheme('sea','td-sea')"></div>
</div>

<div id="stems-grid"></div>
<div id="status"></div>

<div id="cross-wrap">
  <div id="mixer-row">
    <div class="channel-strip" id="arm-vocals" tabindex="0"></div>
    <div class="channel-strip" id="arm-drums" tabindex="0"></div>
    <div class="channel-strip" id="arm-bass" tabindex="0"></div>
    <div class="channel-strip" id="arm-other" tabindex="0"></div>
  </div>
  <div id="dot-wrap">
    <div id="cross-fill"></div>
    <div id="center-dot" tabindex="0"></div>
  </div>
</div>

<div id="transport">
  <div id="prog-wrap"><div id="prog-bar"></div><div id="prog-thumb"></div></div>
  <div id="time">–:–– / –:––</div>
</div>

<button id="export-btn" type="button">export mix</button>

<script>
const STEMS=[
  {id:'vocals',label:'Vocals'},
  {id:'drums', label:'Drums'},
  {id:'bass',  label:'Bass'},
  {id:'other', label:'Other'},
];
const STEPS=7, RAINBOW_DUR=2600, EQ_BARS=12;
const TINTED=['theme-shale','theme-beige','theme-sky','theme-sea'];
const STEM_KEYWORDS={
  vocals:['vocal','vox','voice','sing','lead','melody','choir','lyric','harmony'],
  drums: ['drum','beat','kick','snare','hat','perc','rhythm','trap','loop','bpm','cymbal','clap'],
  bass:  ['bass','sub','low','808','bassline','groove'],
  other: ['other','inst','guitar','piano','keys','synth','pad','string','horn','brass','fx','misc'],
};
const TRANSLATIONS=[
  {t:'Stem Mixer',c:'#012169'},{t:'Mezclador',c:'#c60b1e'},{t:'Mélangeur',c:'#002395'},
  {t:'Stammischer',c:'#000000'},{t:'Miscelatore',c:'#009246'},{t:'ステムミキサー',c:'#bc002d'},
  {t:'Миксер',c:'#003DA5'},{t:'میکسر',c:'#239f40'},{t:'混音器',c:'#de2910'},
  {t:'Karıştırıcı',c:'#e30a17'},{t:'Mikser',c:'#dc143c'},{t:'믹서',c:'#003478'},{t:'Misturador',c:'#009c3b'},
];

let actx=null, masterGain=null, masterAnalyser=null, masterTimeData=null;
let buffers={}, srcNodes={}, gainNodes={}, analyserNodes={}, eqData={};
let vols={vocals:STEPS,drums:STEPS,bass:STEPS,other:STEPS};
let muted={vocals:false,drums:false,bass:false,other:false};
let playing=false, startTime=0, pauseOff=0, duration=0;
let holdTimer=null, soloStem=null, soloSnap={};
const rainbowState={};
let interacting=false;
let glowTimers={};
let dotClickTimer=null, zenMode=false;
// ── Breath state ──────────────────────────────────────────────────
let breathPhase='inhale', breathT=0, breathScale=1, breathGlow=0;
let breathIntensity=0, breathJitterSeed=Math.random()*1000, lastFrameTime=performance.now();
const eqSmooth={};
STEMS.forEach(s=>{eqSmooth[s.id]=new Float32Array(STEPS).fill(0);});

// ── Arm drag-to-volume state ───────────────────────────────────────
let armDrag={active:false,id:null,startY:0,startX:0,startVol:0,moved:false};

const crossWrap= document.getElementById('cross-wrap');
const dot      = document.getElementById('center-dot');
const titleEl  = document.getElementById('title');

// ── Theme ─────────────────────────────────────────────────────────
const THEME_MAP={black:'',shale:'theme-shale',beige:'theme-beige',sky:'theme-sky',sea:'theme-sea'};
function setTheme(name,btnId){
  document.body.className=THEME_MAP[name];
  document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));
  document.getElementById(btnId).classList.add('active');
}

// ── Title hover cycling ───────────────────────────────────────────
let titleIdx=0, titleInterval=null;
function advanceTitle(){
  titleEl.classList.add('fading');
  setTimeout(()=>{
    titleIdx=(titleIdx+1)%TRANSLATIONS.length;
    titleEl.textContent=TRANSLATIONS[titleIdx].t;
    titleEl.style.color=TRANSLATIONS[titleIdx].c;
    titleEl.classList.remove('fading');
  },250);
}
titleEl.addEventListener('mouseenter',()=>{advanceTitle();titleInterval=setInterval(advanceTitle,1000);});
titleEl.addEventListener('mouseleave',()=>{clearInterval(titleInterval);titleInterval=null;});

// ── Drop zones ────────────────────────────────────────────────────
const grid=document.getElementById('stems-grid');
STEMS.forEach(s=>{
  const dz=document.createElement('div');
  dz.className='drop-zone';dz.id='dz-'+s.id;
  dz.innerHTML=`<div class="dz-label">${s.label}</div><div class="dz-hint">drop files / click</div><input type="file" id="fi-${s.id}" accept="audio/*,.mp3,.m4a,.wav,.aif,.aiff,.flac,.ogg" multiple>`;
  dz.addEventListener('click',()=>document.getElementById('fi-'+s.id).click());
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');handleFiles([...e.dataTransfer.files],s.id);});
  grid.appendChild(dz);
  setTimeout(()=>{document.getElementById('fi-'+s.id).addEventListener('change',e=>{if(e.target.files.length)handleFiles([...e.target.files],s.id);});},0);
});

function detectStem(filename){
  const n=filename.toLowerCase();
  for(const [id,keys] of Object.entries(STEM_KEYWORDS))if(keys.some(k=>n.includes(k)))return id;
  return null;
}
function handleFiles(files,fallbackId){
  if(files.length===1){loadStem(fallbackId,files[0]);return;}
  const unmatched=[];
  files.forEach(f=>{const id=detectStem(f.name);if(id)loadStem(id,f);else unmatched.push(f);});
  const emptySlots=STEMS.map(s=>s.id).filter(id=>!buffers[id]);
  unmatched.forEach((f,i)=>loadStem(emptySlots[i]||fallbackId,f));
}

function buildEqCard(id,name){
  const s=STEMS.find(x=>x.id===id);
  const card=document.createElement('div');
  card.className='eq-card';card.id='eq-'+id;
  card.innerHTML=`<div class="eq-label">${s.label}</div>
    <div class="eq-bars" id="eqbars-${id}">${Array.from({length:EQ_BARS},(_,i)=>`<div class="eq-bar" id="eqbar-${id}-${i}"></div>`).join('')}</div>
    <div class="eq-filename">${name.replace(/\.[^.]+$/,'').toUpperCase()}</div>`;
  card.addEventListener('click',()=>{
    muted[id]=!muted[id];
    card.classList.toggle('muted',muted[id]);
    vols[id]=muted[id]?1:STEPS;
    refreshArm(id);applyVol(id);
  });
  (document.getElementById('eq-'+id)||document.getElementById('dz-'+id)).replaceWith(card);
}

// ── Cross arms ────────────────────────────────────────────────────
STEMS.forEach(s=>{
  const arm=document.getElementById('arm-'+s.id);
  const lbl=document.createElement('div');
  lbl.className='arm-label inactive';lbl.id='lbl-'+s.id;lbl.textContent=s.label;
  arm.appendChild(lbl);
  for(let i=0;i<STEPS;i++){
    const btn=document.createElement('button');
    btn.className='seg on';btn.dataset.stem=s.id;btn.dataset.idx=i;
    const fill=document.createElement('div');fill.className='seg-fill';fill.id=`sf-${s.id}-${i}`;
    btn.appendChild(fill);
    btn.addEventListener('click',e=>{
      if(armDrag.moved){e.preventDefault();return;}
      vols[s.id]=i+1;muted[s.id]=(i===0);
      document.getElementById('eq-'+s.id)?.classList.toggle('muted',muted[s.id]);
      refreshArm(s.id);applyVol(s.id);glowArm(s.id);
    });
    arm.appendChild(btn);
  }

  // Arm drag-to-volume — mousedown/touchstart on the whole arm
  arm.addEventListener('mousedown', e=>{
    if(e.target.closest('#center-dot'))return;
    e.stopPropagation();
    armDrag={active:true,id:s.id,startY:e.clientY,startX:e.clientX,startVol:vols[s.id],moved:false};
    interacting=true;
    startHold(e,s.id);
  });
  arm.addEventListener('touchstart', e=>{
    if(e.target.closest('#center-dot'))return;
    e.stopPropagation();
    const t=e.touches[0];
    armDrag={active:true,id:s.id,startY:t.clientY,startX:t.clientX,startVol:vols[s.id],moved:false};
    interacting=true;
    startHold(e,s.id);
  },{passive:true});
});

function applyArmDrag(clientX,clientY){
  if(!armDrag.active)return;
  const dx=clientX-armDrag.startX;
  const dy=clientY-armDrag.startY;
  if(Math.abs(dx)>4||Math.abs(dy)>4) armDrag.moved=true;
  if(!armDrag.moved)return;
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}

  // Vertical fader: dragging up increases volume, dragging down decreases it.
  const delta=(-dy/200)*STEPS;
  const newVol=Math.max(1,Math.min(STEPS,Math.round(armDrag.startVol+delta)));
  if(newVol!==vols[armDrag.id]){
    vols[armDrag.id]=newVol;
    muted[armDrag.id]=(newVol===1);
    document.getElementById('eq-'+armDrag.id)?.classList.toggle('muted',muted[armDrag.id]);
    refreshArm(armDrag.id);applyVol(armDrag.id);
  }
}

window.addEventListener('mousemove', e=>{
  if(!armDrag.active)return;
  applyArmDrag(e.clientX,e.clientY);
});
window.addEventListener('touchmove', e=>{
  if(!armDrag.active)return;
  applyArmDrag(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});
window.addEventListener('mouseup', ()=>{
  if(armDrag.active){armDrag.active=false;interacting=false;}
  endHold();
});
window.addEventListener('touchend', ()=>{
  if(armDrag.active){armDrag.active=false;interacting=false;}
  endHold();
});

// ── Audio ─────────────────────────────────────────────────────────
function initCtx(){
  if(actx)return;
  actx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=actx.createGain();masterGain.gain.value=1;masterGain.connect(actx.destination);
  masterAnalyser=actx.createAnalyser();masterAnalyser.fftSize=1024;masterAnalyser.smoothingTimeConstant=0.35;
  masterGain.connect(masterAnalyser);
  masterTimeData=new Uint8Array(masterAnalyser.fftSize);
  STEMS.forEach(s=>{
    const g=actx.createGain();g.gain.value=1;
    const an=actx.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=0.75;
    g.connect(an);an.connect(masterGain);
    gainNodes[s.id]=g;analyserNodes[s.id]=an;
    eqData[s.id]=new Uint8Array(an.frequencyBinCount);
  });
  // Safari/iOS route-change recovery: watch for the context dropping out from under us
  actx.onstatechange=()=>{
    if(playing&&actx.state!=='running'){
      actx.resume().catch(()=>rebuildAudioGraph());
    }
  };
}
async function loadStem(id,file){
  initCtx();setStatus('Loading '+id+'…');
  try{
    const decoded=await actx.decodeAudioData(await file.arrayBuffer());
    buffers[id]=decoded;
    if(decoded.duration>duration)duration=decoded.duration;
    buildEqCard(id,file.name);
    document.getElementById('lbl-'+id).classList.remove('inactive');
    triggerRainbow(id);updateTimeDisplay();setStatus('');
    if(playing)spawnSrc(id,actx.currentTime-startTime);
  }catch(e){setStatus('Error decoding '+id);}
}
function spawnSrc(id,offset=0){
  if(!buffers[id])return;
  try{srcNodes[id]?.stop();srcNodes[id]?.disconnect();}catch(e){}
  const src=actx.createBufferSource();
  src.buffer=buffers[id];src.connect(gainNodes[id]);
  src.start(0,Math.max(0,offset%buffers[id].duration));
  srcNodes[id]=src;
}
function playAll(){
  if(!hasAnyStem())return;
  if(actx.state==='suspended')actx.resume();
  STEMS.forEach(s=>spawnSrc(s.id,pauseOff));
  startTime=actx.currentTime-pauseOff;
  playing=true;dot.classList.add('playing');
  STEMS.forEach(s=>applyVol(s.id));
}
function pauseAll(){
  pauseOff=actx.currentTime-startTime;
  STEMS.forEach(s=>{try{srcNodes[s.id]?.stop();}catch(e){}});
  playing=false;dot.classList.remove('playing');
}
function hasAnyStem(){return STEMS.some(s=>buffers[s.id]);}

// ── Safari route-change recovery ───────────────────────────────────
let silentFrames=0;
const SILENT_THRESHOLD=6; // ~6 watchdog ticks (300ms each) of true silence while playing

function resyncPlayback(){
  if(!playing)return;
  const elapsed=actx.currentTime-startTime;
  pauseOff=Math.max(0,elapsed%(duration||1));
  try{STEMS.forEach(s=>{try{srcNodes[s.id]?.stop();}catch(e){}});}catch(e){}
  const doResume=()=>{
    STEMS.forEach(s=>spawnSrc(s.id,pauseOff));
    startTime=actx.currentTime-pauseOff;
    STEMS.forEach(s=>applyVol(s.id));
  };
  if(actx.state!=='running'){
    actx.resume().then(doResume).catch(()=>{rebuildAudioGraph();});
  }else{
    doResume();
  }
}

function rebuildAudioGraph(){
  const oldBuffers=buffers; // decoded buffers survive context death
  const wasPlaying=playing;
  try{actx?.close();}catch(e){}
  actx=null;gainNodes={};analyserNodes={};srcNodes={};
  initCtx();
  buffers=oldBuffers;
  STEMS.forEach(s=>applyVol(s.id));
  if(wasPlaying){playing=true;resyncPlayback();}
}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&playing&&actx&&actx.state!=='running'){
    actx.resume().catch(()=>rebuildAudioGraph());
  }
});

setInterval(()=>{
  if(!playing||!actx||!masterAnalyser)return;
  const anyAudible=STEMS.some(s=>buffers[s.id]&&!muted[s.id]&&vols[s.id]>1);
  if(!anyAudible){silentFrames=0;return;}
  masterAnalyser.getByteTimeDomainData(masterTimeData);
  let sum=0;
  for(let i=0;i<masterTimeData.length;i++){const v=(masterTimeData[i]-128)/128;sum+=v*v;}
  const rms=Math.sqrt(sum/masterTimeData.length);
  if(rms<0.001){
    silentFrames++;
    if(silentFrames>=SILENT_THRESHOLD){silentFrames=0;resyncPlayback();}
  }else{
    silentFrames=0;
  }
},300);

// ── Export ────────────────────────────────────────────────────────
function audioBufferToWav(buffer){
  const numCh=buffer.numberOfChannels,sr=buffer.sampleRate;
  const dataLen=buffer.length*numCh*2;
  const arrBuf=new ArrayBuffer(44+dataLen);
  const view=new DataView(arrBuf);
  function writeStr(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}
  writeStr(0,'RIFF');view.setUint32(4,36+dataLen,true);writeStr(8,'WAVE');
  writeStr(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);
  view.setUint16(22,numCh,true);view.setUint32(24,sr,true);
  view.setUint32(28,sr*numCh*2,true);view.setUint16(32,numCh*2,true);view.setUint16(34,16,true);
  writeStr(36,'data');view.setUint32(40,dataLen,true);
  const chans=[];for(let c=0;c<numCh;c++)chans.push(buffer.getChannelData(c));
  let offset=44;
  for(let i=0;i<buffer.length;i++){
    for(let c=0;c<numCh;c++){
      let s=Math.max(-1,Math.min(1,chans[c][i]));
      view.setInt16(offset,s<0?s*0x8000:s*0x7fff,true);
      offset+=2;
    }
  }
  return new Blob([arrBuf],{type:'audio/wav'});
}

async function exportMix(){
  if(!hasAnyStem()||!duration){setStatus('Nothing to export');setTimeout(()=>setStatus(''),1500);return;}
  const btn=document.getElementById('export-btn');
  btn.disabled=true;setStatus('Rendering mix…');
  try{
    const sr=actx?actx.sampleRate:44100;
    const offline=new OfflineAudioContext(2,Math.ceil(duration*sr),sr);
    STEMS.forEach(s=>{
      if(!buffers[s.id])return;
      const src=offline.createBufferSource();src.buffer=buffers[s.id];
      const g=offline.createGain();g.gain.value=muted[s.id]?0:vols[s.id]/STEPS;
      src.connect(g);g.connect(offline.destination);
      src.start(0);
    });
    const rendered=await offline.startRendering();
    const blob=audioBufferToWav(rendered);
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='stem-mix.wav';document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    setStatus('');
  }catch(e){console.error(e);setStatus('Export failed');}
  btn.disabled=false;
}
document.getElementById('export-btn').addEventListener('click',exportMix);
function applyVol(id){
  if(!gainNodes[id])return;
  gainNodes[id].gain.setTargetAtTime(muted[id]?0:vols[id]/STEPS,actx.currentTime,0.02);
}
function glowArm(id){
  clearTimeout(glowTimers[id]);
  document.querySelectorAll('#arm-'+id+' .seg').forEach(b=>b.classList.add('glowing'));
  glowTimers[id]=setTimeout(()=>document.querySelectorAll('#arm-'+id+' .seg').forEach(b=>b.classList.remove('glowing')),600);
}
function startHold(e,id){
  interacting=true;
  holdTimer=setTimeout(()=>{
    holdTimer=null;soloStem=id;
    STEMS.forEach(s=>{
      if(s.id!==id){
        soloSnap[s.id]=vols[s.id];
        gainNodes[s.id]?.gain.setTargetAtTime(0,actx.currentTime,0.02);
        document.querySelectorAll('#arm-'+s.id+' .seg').forEach(b=>b.classList.add('muted'));
      }
    });
  },350);
}
function endHold(){
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
  interacting=false;
  if(!soloStem)return;
  STEMS.forEach(s=>{
    if(s.id!==soloStem){
      gainNodes[s.id]?.gain.setTargetAtTime((soloSnap[s.id]??vols[s.id])/STEPS,actx.currentTime,0.05);
      document.querySelectorAll('#arm-'+s.id+' .seg').forEach(b=>b.classList.remove('muted'));
    }
  });
  soloSnap={};soloStem=null;
}

function refreshArm(id){
  document.querySelectorAll('#arm-'+id+' .seg').forEach((b,i)=>{
    b.classList.toggle('on',i<vols[id]);
    b.classList.toggle('muted',muted[id]);
    b.style.background='';
  });
}
STEMS.forEach(s=>refreshArm(s.id));

// ── EQ bars (card) ────────────────────────────────────────────────
function updateEqBars(){
  STEMS.forEach(s=>{
    const an=analyserNodes[s.id];if(!an)return;
    an.getByteFrequencyData(eqData[s.id]);
    const data=eqData[s.id],bins=data.length;
    for(let i=0;i<EQ_BARS;i++){
      const bar=document.getElementById('eqbar-'+s.id+'-'+i);if(!bar)continue;
      const val=muted[s.id]?0:(data[Math.floor(i/EQ_BARS*bins)]||0);
      bar.style.height=Math.max(4,Math.round(val/255*100))+'%';
      const br=Math.round(20+val*0.08);
      bar.style.background=playing&&!muted[s.id]?`rgb(${br},${br},${br})`:'';
    }
  });
}

// ── Arm EQ ────────────────────────────────────────────────────────
function getSegBandEnergy(id,segIdx){
  const data=eqData[id];if(!data)return 0;
  const bins=data.length;
  const lo=Math.floor(Math.pow(segIdx/STEPS,1.6)*bins);
  const hi=Math.floor(Math.pow((segIdx+1)/STEPS,1.6)*bins);
  const count=Math.max(1,hi-lo);
  let sum=0;for(let i=lo;i<hi;i++)sum+=data[i]||0;
  return sum/count/255;
}

// Get a single monochrome brightness from the theme's --seg-on
function getThemeBrightness(){
  if(isTinted()){
    const rgb=getThemeSegRGB();
    if(rgb)return{r:rgb[0],g:rgb[1],b:rgb[2]};
  }
  return{r:40,g:40,b:40};
}

function updateArmEq(){
  STEMS.forEach(s=>{
    const an=analyserNodes[s.id];
    if(an)an.getByteFrequencyData(eqData[s.id]);

    const segs=document.querySelectorAll('#arm-'+s.id+' .seg');
    segs.forEach((btn,i)=>{
      const raw=an&&playing&&buffers[s.id]?getSegBandEnergy(s.id,i):0;
      eqSmooth[s.id][i]=raw>eqSmooth[s.id][i]
        ?raw*0.7+eqSmooth[s.id][i]*0.3
        :raw*0.1+eqSmooth[s.id][i]*0.9;

      const level=muted[s.id]?0:eqSmooth[s.id][i];
      const fill=document.getElementById(`sf-${s.id}-${i}`);
      const pct=Math.round(level*100);

      if(fill){
        fill.style.opacity=level>0.04?'0.8':'0';
        fill.style.height=pct+'%';fill.style.width='100%';
      }

      // Single unified colour — no hue variation
      if(!rainbowState[s.id]?.active&&btn.classList.contains('on')&&!muted[s.id]){
        const base=getThemeBrightness();
        const boost=Math.round(level*60);
        const r=Math.min(255,base.r+boost),g=Math.min(255,base.g+boost),b=Math.min(255,base.b+boost);
        const col=`rgb(${r},${g},${b})`;
        btn.style.background=col;
        if(fill)fill.style.background=col;
      } else if(!rainbowState[s.id]?.active){
        btn.style.background='';
        if(fill)fill.style.background='';
      }
    });
  });
}

function isTinted(){return TINTED.includes(document.body.className);}
function getThemeSegRGB(){
  const base=getComputedStyle(document.body).getPropertyValue('--seg-on').trim();
  const tmp=document.createElement('div');
  tmp.style.color=base;document.body.appendChild(tmp);
  const c=getComputedStyle(tmp).color;document.body.removeChild(tmp);
  const m=c.match(/\d+/g);return m?[+m[0],+m[1],+m[2]]:null;
}

// ── Zen mode ──────────────────────────────────────────────────────
function uiEls(){
  return[document.getElementById('stems-grid'),document.getElementById('status'),document.getElementById('transport'),document.getElementById('theme-row'),document.querySelector('h1'),document.querySelector('a'),document.getElementById('export-btn')].filter(Boolean);
}
function enterZen(){
  zenMode=true;
  uiEls().forEach(el=>{el.style.transition='opacity 1.2s ease';el.style.opacity='0';el.style.pointerEvents='none';});
  const r=crossWrap.getBoundingClientRect();
  crossWrap.style.transform=`translateY(${window.innerHeight/2-(r.top+r.height/2)}px)`;
}
function exitZen(){
  zenMode=false;
  uiEls().forEach(el=>{el.style.transition='opacity 1.2s ease';el.style.opacity='1';el.style.pointerEvents='';});
  crossWrap.style.transform='translateY(0px)';
}

dot.addEventListener('click',e=>{
  e.stopPropagation();if(!hasAnyStem())return;
  initCtx();if(actx.state==='suspended')actx.resume();
  if(dotClickTimer){clearTimeout(dotClickTimer);dotClickTimer=null;zenMode?exitZen():enterZen();return;}
  dotClickTimer=setTimeout(()=>{dotClickTimer=null;playing?pauseAll():playAll();},220);
});

// ── Progress bar: click + drag-to-scrub (mouse & touch) ────────────
const progWrap = document.getElementById('prog-wrap');
const progBar  = document.getElementById('prog-bar');
const progThumb= document.getElementById('prog-thumb');
let scrubbing = false, wasPlayingBeforeScrub = false;

function pctFromClientX(clientX){
  const rect = progWrap.getBoundingClientRect();
  return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
}
function renderScrubPosition(pct){
  progBar.style.width = (pct*100)+'%';
  progThumb.style.left = (pct*100)+'%';
  document.getElementById('time').textContent = fmt(pct*duration) + ' / ' + fmt(duration);
}
function startScrub(clientX){
  if(!duration)return;
  scrubbing = true;
  progWrap.classList.add('scrubbing');
  wasPlayingBeforeScrub = playing;
  if(playing) pauseAll(); // freeze audio while dragging, resume on release
  renderScrubPosition(pctFromClientX(clientX));
}
function moveScrub(clientX){
  if(!scrubbing)return;
  renderScrubPosition(pctFromClientX(clientX));
}
function endScrub(clientX){
  if(!scrubbing)return;
  scrubbing = false;
  progWrap.classList.remove('scrubbing');
  const pct = pctFromClientX(clientX);
  pauseOff = pct*duration;
  renderScrubPosition(pct);
  if(wasPlayingBeforeScrub){ initCtx(); if(actx.state==='suspended')actx.resume(); playAll(); }
}

// mouse
progWrap.addEventListener('mousedown', e=>{ e.preventDefault(); startScrub(e.clientX); });
window.addEventListener('mousemove', e=>{ if(scrubbing) moveScrub(e.clientX); });
window.addEventListener('mouseup', e=>{ if(scrubbing) endScrub(e.clientX); });

// touch
progWrap.addEventListener('touchstart', e=>{
  startScrub(e.touches[0].clientX);
}, {passive:true});
progWrap.addEventListener('touchmove', e=>{
  if(scrubbing){ e.preventDefault(); moveScrub(e.touches[0].clientX); }
}, {passive:false});
progWrap.addEventListener('touchend', e=>{
  endScrub(e.changedTouches[0].clientX);
});

// ── Keyboard ──────────────────────────────────────────────────────
// Space         play / pause
// ←  →          seek 5s back / forward
// Tab           move focus between channel strips / play dot
// ↑  ↓          (while a channel strip is focused) raise / lower that channel
// M             (while a channel strip is focused) toggle mute on it
// 1 2 3 4       toggle mute on vocals / drums / bass / other directly
// Z             toggle zen mode
function bumpVol(id,dir){
  const newVol=Math.max(1,Math.min(STEPS,vols[id]+dir));
  if(newVol===vols[id])return;
  vols[id]=newVol;muted[id]=(newVol===1);
  document.getElementById('eq-'+id)?.classList.toggle('muted',muted[id]);
  refreshArm(id);applyVol(id);glowArm(id);
}
function toggleMute(id){
  if(!buffers[id])return;
  muted[id]=!muted[id];
  vols[id]=muted[id]?1:STEPS;
  document.getElementById('eq-'+id)?.classList.toggle('muted',muted[id]);
  refreshArm(id);applyVol(id);
}
function seekBy(sec){
  if(!duration)return;
  const cur=playing?(actx.currentTime-startTime):pauseOff;
  pauseOff=Math.max(0,Math.min(duration,cur+sec));
  if(playing){pauseAll();playAll();}
  else{document.getElementById('prog-bar').style.width=(pauseOff/duration*100)+'%';document.getElementById('time').textContent=fmt(pauseOff)+' / '+fmt(duration);}
}
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const focusedChannel=document.activeElement?.closest?.('.channel-strip');

  if(e.code==='Space'){
    e.preventDefault();
    if(!hasAnyStem())return;
    initCtx();if(actx.state==='suspended')actx.resume();
    playing?pauseAll():playAll();
    return;
  }
  if(e.key==='z'||e.key==='Z'){
    if(!hasAnyStem())return;
    zenMode?exitZen():enterZen();
    return;
  }
  if(focusedChannel){
    const id=focusedChannel.id.replace('arm-','');
    if(e.key==='ArrowUp'){e.preventDefault();bumpVol(id,1);return;}
    if(e.key==='ArrowDown'){e.preventDefault();bumpVol(id,-1);return;}
    if(e.key==='m'||e.key==='M'){toggleMute(id);return;}
  }else{
    if(e.key==='ArrowLeft'){e.preventDefault();seekBy(-5);return;}
    if(e.key==='ArrowRight'){e.preventDefault();seekBy(5);return;}
  }
  if(['1','2','3','4'].includes(e.key)){
    const id=STEMS[+e.key-1]?.id;
    if(id)toggleMute(id);
  }
});

// ── Rainbow ───────────────────────────────────────────────────────
function triggerRainbow(id){rainbowState[id]={start:performance.now(),active:true};}
function rainbowColor(idx,elapsed){
  // Single colour rainbow — brightness wave only, no hue shift
  const prog=Math.min(elapsed/RAINBOW_DUR,1);
  const wave=Math.sin(Math.PI*(prog-idx*0.07));
  const bright=Math.max(0,wave)*(1-Math.pow(prog,2.5));
  if(isTinted()){
    const rgb=getThemeSegRGB();
    if(rgb){
      const b=Math.round(bright*110);
      return`rgb(${Math.min(255,rgb[0]+b)},${Math.min(255,rgb[1]+b)},${Math.min(255,rgb[2]+b)})`;
    }
  }
  const br=Math.round(18+bright*55);
  return`rgb(${br},${br},${br})`;
}

// ── Breath engine ─────────────────────────────────────────────────
// The mixer breathes on its own even in silence (a slow resting breath),
// and the music reshapes that breath: louder/denser passages pull it into
// a shorter, shallower, quicker rhythm (like exertion); quiet passages let
// it settle back into a long, deep, unhurried one.
function easeOutQuint(t){return 1-Math.pow(1-t,5);}
function easeInOutSine(t){return -(Math.cos(Math.PI*t)-1)/2;}

function getInstantLoudness(){
  if(!masterAnalyser||!playing)return 0;
  masterAnalyser.getByteTimeDomainData(masterTimeData);
  let sum=0;
  for(let i=0;i<masterTimeData.length;i++){const v=(masterTimeData[i]-128)/128;sum+=v*v;}
  return Math.sqrt(sum/masterTimeData.length);
}

function updateBreath(dt){
  const inst=getInstantLoudness();
  // slow attack/release smoothing so rate/depth drift rather than snap
  const smoothRate=inst>breathIntensity?0.9:0.35;
  breathIntensity+=(Math.min(1,inst*4.2)-breathIntensity)*Math.min(1,dt*smoothRate);

  const k=breathIntensity;
  // resting (quiet) durations vs. active (loud) durations, in seconds
  const inhaleDur =1.35-(1.35-0.55)*k;
  const holdTopDur=0.35-(0.35-0.05)*k;
  const exhaleDur =2.0 -(2.0 -0.75)*k;
  const holdBotDur=0.7 -(0.7 -0.12)*k;
  const depth=0.085*(1-0.35*k)+0.02*k; // shallower net swing when exerted

  breathT+=dt;
  let dur=breathPhase==='inhale'?inhaleDur:breathPhase==='holdTop'?holdTopDur:breathPhase==='exhale'?exhaleDur:holdBotDur;
  if(breathT>=dur){
    breathT-=dur;
    breathPhase=breathPhase==='inhale'?'holdTop':breathPhase==='holdTop'?'exhale':breathPhase==='exhale'?'holdBottom':'inhale';
    if(breathPhase==='inhale')breathJitterSeed=Math.random()*1000; // per-cycle organic drift
  }
  const p=dur>0?Math.min(1,breathT/dur):1;
  let shape;
  if(breathPhase==='inhale')shape=easeOutQuint(p);
  else if(breathPhase==='holdTop')shape=1;
  else if(breathPhase==='exhale')shape=1-easeInOutSine(p);
  else shape=0;

  const microJitter=Math.sin(performance.now()*0.0065+breathJitterSeed)*0.0035*(1-k*0.5);
  breathScale=1+depth*shape+microJitter;
  breathGlow=shape;
}

function applyBreathVisuals(){
  dot.style.transform=`scale(${breathScale.toFixed(4)})`;
  const fill=document.getElementById('cross-fill');
  if(fill&&!zenMode)fill.style.opacity=(0.34+breathGlow*0.22).toFixed(3);
  const bg=document.getElementById('bg-breath');
  if(bg){
    bg.style.opacity=(0.05+breathGlow*0.09).toFixed(3);
    bg.style.transform=`scale(${(1+(breathScale-1)*2.2).toFixed(4)})`;
  }
}

// ── Animate ───────────────────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const dt=Math.min(0.1,(now-lastFrameTime)/1000);
  lastFrameTime=now;
  updateBreath(dt);
  applyBreathVisuals();

  updateEqBars();
  updateArmEq();

  STEMS.forEach(s=>{
    const rs=rainbowState[s.id];
    if(rs?.active){
      const el=performance.now()-rs.start;
      if(el<RAINBOW_DUR){
        document.querySelectorAll('#arm-'+s.id+' .seg').forEach((b,i)=>{
          const c=rainbowColor(i,el);
          b.style.background=c;
          const fill=document.getElementById(`sf-${s.id}-${i}`);
          if(fill)fill.style.background=c;
        });
        return;
      }
      rs.active=false;
      document.querySelectorAll('#arm-'+s.id+' .seg').forEach(b=>b.style.background='');
    }
  });

  if(playing&&duration>0&&!scrubbing){
    const el=actx.currentTime-startTime;
    document.getElementById('prog-bar').style.width=Math.min(el/duration*100,100)+'%';
    document.getElementById('prog-thumb').style.left=Math.min(el/duration*100,100)+'%';
    document.getElementById('time').textContent=fmt(el)+' / '+fmt(duration);
    if(el>=duration+0.2){pauseOff=0;playing=false;dot.classList.remove('playing');document.getElementById('prog-bar').style.width='0%';document.getElementById('prog-thumb').style.left='0%';}
  }
}

function updateTimeDisplay(){if(!playing)document.getElementById('time').textContent='0:00 / '+fmt(duration);}
function fmt(s){const m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+(sc<10?'0':'')+sc;}
function setStatus(msg){document.getElementById('status').textContent=msg;}
animate();
</script>
