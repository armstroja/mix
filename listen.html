<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAGE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0d0d0d;color:#272727;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
h1{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#272727;}
#code-input{
  background:none;border:1px solid #202020;border-radius:8px;
  color:#e8e2d8;font-size:20px;letter-spacing:.4em;text-align:center;
  width:160px;padding:12px 0 12px 12px;text-transform:uppercase;
  font-family:inherit;outline:none;
}
#code-input:focus{border-color:#383838;}
#join-btn,#dot{
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#join-btn{
  background:none;border:1px solid #181818;border-radius:20px;
  color:#727272;font-size:8px;letter-spacing:.22em;text-transform:uppercase;
  padding:10px 22px;cursor:pointer;font-family:inherit;transition:border-color .2s,color .2s;
}
#join-btn:hover{border-color:#383838;color:#e8e2d8;}
#join-btn:disabled{opacity:.3;cursor:default;}
#dot-wrap{width:150px;height:150px;display:none;align-items:center;justify-content:center;position:relative;}
#dot{
  width:56px;height:56px;border-radius:50%;background:#181818;border:1px solid #202020;
  transition:background .3s,border-color .3s,transform .3s ease;
}
#dot.connected{background:#1e1e1e;border-color:#2a2a2a;animation:breathe 3.2s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
#status{font-size:9px;letter-spacing:.16em;color:#202020;text-transform:uppercase;min-height:12px;}
#room-label{font-size:8px;letter-spacing:.3em;color:#202020;text-transform:uppercase;display:none;}
</style>
</head>
<body>
<h1>Stage</h1>
<input id="code-input" maxlength="4" placeholder="CODE" autocomplete="off">
<button id="join-btn" type="button">listen</button>
<div id="room-label"></div>
<div id="dot-wrap"><div id="dot"></div></div>
<div id="status"></div>

<script type="module">
const STAGE_APP_ID='jaacck-me-stage-v1';
const codeInput=document.getElementById('code-input');
const joinBtn=document.getElementById('join-btn');
const statusEl=document.getElementById('status');
const dotWrap=document.getElementById('dot-wrap');
const dot=document.getElementById('dot');
const roomLabel=document.getElementById('room-label');

function setStatus(msg){statusEl.textContent=msg;}

const params=new URLSearchParams(location.search);
const prefill=(params.get('code')||'').toUpperCase();
if(prefill){codeInput.value=prefill;}
codeInput.focus();

let room=null, audioEl=null;

function attachStream(stream){
  audioEl=new Audio();
  audioEl.srcObject=stream;
  audioEl.autoplay=true;
  audioEl.play().catch(()=>{}); // join click already satisfies the user-gesture requirement
  dotWrap.style.display='flex';
  dot.classList.add('connected');
  setStatus('Live');
  joinBtn.style.display='none';
  codeInput.style.display='none';
}

async function join(){
  const code=codeInput.value.trim().toUpperCase();
  if(code.length<4){setStatus('Enter a 4-letter code');return;}
  joinBtn.disabled=true;setStatus('Connecting…');
  roomLabel.textContent=code;
  roomLabel.style.display='block';

  const {joinRoom}=await import('https://esm.run/trystero/torrent');
  room=joinRoom({appId:STAGE_APP_ID},code);

  room.onPeerStream((stream)=>{attachStream(stream);});
  room.onPeerLeave(()=>{
    setStatus('Stage ended');
    dot.classList.remove('connected');
  });

  // if nothing shows up after a while, the code was probably wrong / stage not live
  setTimeout(()=>{
    if(!audioEl)setStatus('No stage found — check the code');
  },8000);
}

joinBtn.addEventListener('click',join);
codeInput.addEventListener('keydown',e=>{if(e.key==='Enter')join();});
codeInput.addEventListener('input',()=>{codeInput.value=codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});
</script>
</body>
</html>
